global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: greenops-local
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          env: local

  # The live service. Off by default: the free Render instance sleeps after 15 idle minutes,
  # and a 15 s scrape would keep it awake. Uncomment for the demo.
