name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (tests that need raw data skip themselves)
        run: python -m pytest -q

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: greenops-api:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: docker run -d --name api -p 8000:8000 -e PREDICTOR=stub greenops-api:ci
      - name: Wait for readiness
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ready >/dev/null 2>&1; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "service did not become ready in time"; exit 1
      - name: Smoke test endpoints
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8000/ready | grep -q '"ready":true'
          curl -fsS -X POST http://localhost:8000/v1/forecast \
            -H 'Content-Type: application/json' \
            -d '{"site":"pavagada","as_of":"2025-06-01"}' | grep -q 'sunlight_kwh_m2'
      - name: Container logs
        if: always()
        run: docker logs api || true
      - name: Stop container
        if: always()
        run: docker rm -f api || true
