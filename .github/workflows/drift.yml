name: drift

# Drift is a signal for people to act on, not a broken build. This workflow is kept apart from
# ci.yml so it can never gate publish-image or deploy (only the quality gates do), and the job is
# continue-on-error so a drifting or erroring check never turns a run red for the team.
# It is also why the weekly schedule lives here: a cron in ci.yml would republish and redeploy.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenario:
        description: Induced drift scenario to check
        type: choice
        default: none
        options: [none, cloudy_monsoon, sensor_fault, heatwave]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      SCENARIO: ${{ inputs.scenario || 'none' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the serving and monitoring extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[serve,monitor]" "dvc==3.67.1"
      - name: Pull serving bundle (DVC)
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user "$DAGSHUB_USER"
          dvc remote modify --local dagshub password "$DAGSHUB_TOKEN"
          dvc pull serve
      - name: Drift check (PSI)
        run: python -m solarwind.monitoring.drift check --scenario "$SCENARIO"
      - name: Performance drift
        run: python -m solarwind.monitoring.performance
      - name: Evidently reports
        run: python -m solarwind.monitoring.report --all
      - name: Job summary
        if: always()
        run: python monitoring/drift_summary.py results/monitoring/drift_latest.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports
          path: |
            web/reports/*.html
            results/monitoring/drift_latest.json
            results/monitoring/performance.csv
            results/monitoring/performance_lowwind.csv
          if-no-files-found: warn
