[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solarwind"
version = "0.1.0"
description = "SolarWind Advisor: data pipeline for Karnataka solar and wind generation and NASA POWER weather"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru==0.7.3",
    "openpyxl==3.1.5",
    "pandas==2.3.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "requests==2.32.5",
    "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
    "dvc==3.67.1",
    "pytest==8.3.3",
    "ruff==0.17.0",
]
notebook = [
    "ipykernel==7.4.0",
    "matplotlib==3.10.6",
    "nbclient==0.11.0",
    "nbconvert==7.17.1",
    "nbformat==5.11.1",
]
scripts = [
    "pdfplumber==0.11.10",
]

[project.scripts]
solarwind-cea-download = "solarwind.data.cea.download:main"
solarwind-cea-build = "solarwind.data.cea.build_daily:main"
solarwind-nasa-download = "solarwind.data.nasa.download:main"
solarwind-nasa-summary = "solarwind.data.nasa.summary:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]
