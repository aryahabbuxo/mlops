stages:
  parse_cea:
    cmd: python -m solarwind.data.cea.build_daily
    deps:
      - data/raw/cea
      - src/solarwind/data/cea
      - src/solarwind/config
      - src/solarwind/logging_setup.py
    outs:
      - data/processed/karnataka_daily.csv
      - data/processed/flags.txt
      - data/processed/parse_failures.txt

  validate_nasa:
    cmd: python -m solarwind.data.nasa.summary
    deps:
      - data/raw/nasa
      - config/sites.csv
      - src/solarwind/data/nasa
      - src/solarwind/config
      - src/solarwind/logging_setup.py
    outs:
      - data/processed/nasa_summary.csv

  featurize:
    cmd: python -m solarwind.features.build
    deps:
      - data/processed/karnataka_daily.csv
      - data/raw/nasa
      - config/sites.csv
      - src/solarwind/features
      - src/solarwind/config
      - src/solarwind/data/join.py
      - src/solarwind/data/tables.py
      - src/solarwind/data/nasa/loader.py
      - src/solarwind/logging_setup.py
    outs:
      - data/processed/features.csv

  build_full_series:
    cmd: python -m solarwind.data.full_series
    deps:
      - data/raw/idp
      - data/processed/karnataka_daily.csv
      - src/solarwind/data/full_series.py
      - src/solarwind/data/idp
      - src/solarwind/config
      - src/solarwind/logging_setup.py
    outs:
      - data/processed/karnataka_daily_full.csv
      - data/processed/idp_flags.txt

  build_capacity:
    cmd: python -m solarwind.data.capacity
    deps:
      - config/capacity_knots.csv
      - src/solarwind/data/capacity.py
      - src/solarwind/config
      - src/solarwind/logging_setup.py
    outs:
      - data/processed/karnataka_capacity_monthly.csv
