stages:
  parse_cea:
    cmd: python src/cea_build_daily.py
    deps:
      - data/raw/cea
      - src/cea_build_daily.py
      - src/cea_parse.py
    outs:
      - data/processed/karnataka_daily.csv
      - data/processed/flags.txt
      - data/processed/parse_failures.txt

  validate_nasa:
    cmd: python src/nasa_summary.py
    deps:
      - data/raw/nasa
      - config/sites.csv
      - src/nasa_download.py
      - src/nasa_summary.py
    outs:
      - data/processed/nasa_summary.csv
