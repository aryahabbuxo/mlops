stages:
  parse_cea:
    cmd: python -m solarwind.data.cea.build_daily
    deps:
      - data/raw/cea
      - src/solarwind/data/cea
      - src/solarwind/config
      - src/solarwind/logging_setup.py
    outs:
      - data/processed/karnataka_daily.csv
      - data/processed/flags.txt
      - data/processed/parse_failures.txt

  validate_nasa:
    cmd: python -m solarwind.data.nasa.summary
    deps:
      - data/raw/nasa
      - config/sites.csv
      - src/solarwind/data/nasa
      - src/solarwind/config
      - src/solarwind/logging_setup.py
    outs:
      - data/processed/nasa_summary.csv
